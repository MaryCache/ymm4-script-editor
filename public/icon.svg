<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- YMM4台本エディタ ブランドマーク: ダーク背景 + アクセントカラーで "台" グリフを表示 -->
  <!-- PNG 非依存（ImageMagick 不要）。ベクタなので全サイズに対応。Chrome/Edge の PWA install 要件を満たす -->
  <rect width="512" height="512" rx="80" fill="#0f1117"/>
  <!-- 「台」の略字を幾何形状で表現: 台形 + 下部長方形 = 台本エディタのアイコン -->
  <!-- 上部：台形（台の上の部分） -->
  <path d="M180 130 L332 130 L300 200 L212 200 Z" fill="#5b8dff"/>
  <!-- 中部：横棒 -->
  <rect x="140" y="218" width="232" height="36" rx="8" fill="#5b8dff"/>
  <!-- 下部：縦棒（左） -->
  <rect x="192" y="270" width="36" height="110" rx="6" fill="#5b8dff"/>
  <!-- 下部：縦棒（右） -->
  <rect x="284" y="270" width="36" height="110" rx="6" fill="#5b8dff"/>
  <!-- 下部：底辺横棒 -->
  <rect x="140" y="358" width="232" height="36" rx="8" fill="#5b8dff"/>
</svg>
